[workspace]
resolver = "3"
members = [
    "crates/kartta",
    "crates/kartta-cache",
    "crates/kartta-ffi",
    "crates/kartta-fs",
    "crates/kartta-fuzz",
    "crates/kartta-graph",
    "crates/kartta-lang",
    "crates/kartta-lang-bash",
    "crates/kartta-lang-blk",
    "crates/kartta-lang-cpp",
    "crates/kartta-lang-daslang",
    "crates/kartta-lang-dshl",
    "crates/kartta-lang-go",
    "crates/kartta-lang-jsts",
    "crates/kartta-lang-lua",
    "crates/kartta-lang-php",
    "crates/kartta-lang-puppet",
    "crates/kartta-lang-python",
    "crates/kartta-lang-quirrel",
    "crates/kartta-lang-ruby",
    "crates/kartta-lang-rust",
    "crates/kartta-languages",
    "crates/kartta-mcp",
    "crates/kartta-node",
    "crates/kartta-walk",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/GaijinEntertainment/kartta"
authors = ["Gaijin Entertainment"]

[workspace.dependencies]
kartta = { version = "0.1.0", path = "crates/kartta" }
kartta-cache = { version = "0.1.0", path = "crates/kartta-cache" }
kartta-ffi = { version = "0.1.0", path = "crates/kartta-ffi" }
kartta-fs = { version = "0.1.0", path = "crates/kartta-fs" }
kartta-fuzz = { version = "0.1.0", path = "crates/kartta-fuzz" }
kartta-graph = { version = "0.1.0", path = "crates/kartta-graph" }
kartta-lang = { version = "0.1.0", path = "crates/kartta-lang" }
kartta-lang-bash = { version = "0.1.0", path = "crates/kartta-lang-bash" }
kartta-lang-blk = { version = "0.1.0", path = "crates/kartta-lang-blk" }
kartta-lang-cpp = { version = "0.1.0", path = "crates/kartta-lang-cpp" }
kartta-lang-daslang = { version = "0.1.0", path = "crates/kartta-lang-daslang" }
kartta-lang-dshl = { version = "0.1.0", path = "crates/kartta-lang-dshl" }
kartta-lang-go = { version = "0.1.0", path = "crates/kartta-lang-go" }
kartta-lang-jsts = { version = "0.1.0", path = "crates/kartta-lang-jsts" }
kartta-lang-lua = { version = "0.1.0", path = "crates/kartta-lang-lua" }
kartta-lang-php = { version = "0.1.0", path = "crates/kartta-lang-php" }
kartta-lang-puppet = { version = "0.1.0", path = "crates/kartta-lang-puppet" }
kartta-lang-python = { version = "0.1.0", path = "crates/kartta-lang-python" }
kartta-lang-quirrel = { version = "0.1.0", path = "crates/kartta-lang-quirrel" }
kartta-lang-ruby = { version = "0.1.0", path = "crates/kartta-lang-ruby" }
kartta-lang-rust = { version = "0.1.0", path = "crates/kartta-lang-rust" }
kartta-languages = { version = "0.1.0", path = "crates/kartta-languages" }
kartta-walk = { version = "0.1.0", path = "crates/kartta-walk" }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
elided_lifetimes_in_paths = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Groups carry priority = -1 so the individual entries below win on conflict. Everything except `restriction` is on:
# `nursery` included, since its false positives cost less than the defects it catches in agent-written code.
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Shape: thresholds live in clippy.toml, these are the lints that read them.
cognitive_complexity = "warn"
excessive_nesting = "warn"

# No panics in library code. clippy.toml exempts tests, where a proven panic is the assertion.
expect_used = "warn"
panic = "warn"
unwrap_used = "warn"

# Left-behind scaffolding and debug output, which is what an interrupted agent run leaves.
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unimplemented = "warn"

# Suppressions must be self-expiring and justified: `expect` warns once the lint stops firing.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# unsafe stays documented one operation at a time.
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"

# Contradicts rustc's `unreachable_pub`, which this workspace enables: `redundant_pub_crate` demands `pub` for an item
# inside a private module, `unreachable_pub` demands `pub(crate)` for the same item. The rustc lint wins, because it is
# the one keeping the published surface honest.
redundant_pub_crate = "allow"

# Remaining `restriction` picks. The group as a whole is never enabled: its lints forbid reasonable code and
# contradict each other.
clone_on_ref_ptr = "warn"
exit = "warn"
mem_forget = "warn"
rc_buffer = "warn"
verbose_file_reads = "warn"

[profile.release]
# Local work; the distributed artifacts build with `dist`.
opt-level = 3

[profile.dist]
# The artifacts a release ships. Panics keep unwinding: the C ABI catches them at its boundary.
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.profiling]
# Release codegen with full debug info so sampling profilers resolve inlined frames.
inherits = "release"
debug = true
