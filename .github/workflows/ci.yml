name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # Rustdoc with warnings denied, over this workspace's own crates. A broken intra-doc link, a malformed doc attribute
  # or an undocumented public item fails no other job, so without this one it reaches the published documentation.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # constraint: the target is one watch.rs gives `watch/unsupported.rs`, which no other job compiles
  unsupported-watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add x86_64-unknown-freebsd
      - run: cargo clippy --locked -p kartta-fs --features watch --target x86_64-unknown-freebsd -- -D warnings

  test:
    env:
      # constraint: the Ubuntu runner starts with 12 GB free, and full debug info fills it with `target` alone
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        # Every platform a plane is consumed on: the vendored grammars compile C, and the FFI boundary is where
        # platform assumptions break.
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every feature, as the clippy job builds: the watcher's backend differs per platform, and this is the only job
      # that runs its tests on each.
      - run: cargo build --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features

  # The Go binding, linked against the static library the same checkout builds. Its cgo build compiles the
  # hand-written kartta.h and links every function it declares, so a header that drifts from the library fails here,
  # and the round trip exercises the ABI's ownership rules under the race detector.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      CGO_LDFLAGS: -L${{ github.workspace }}/target/debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Go version is the one go.mod's go directive names; the module has no dependencies to cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bindings/go/go.mod
          cache: false
      - run: cargo build --locked -p kartta-ffi
      - run: go vet ./...
        working-directory: bindings/go
      - run: go test -race ./...
        working-directory: bindings/go
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: bindings/go

  # The Node binding, loading the addon the same checkout builds. Its tests replay the golden files through every typed
  # call and run builds that a signal or close cancels, and its type check holds the wire types to the golden answers.
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    # A test that blocks the JS thread for good would hold the runner for GitHub's 6-hour default (#364).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: bindings/node/.nvmrc
      - run: npm ci --ignore-scripts
      # The vp that package-lock.json pins, so the toolchain moves with the lockfile rather than with an action.
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: vp fmt --check
      - run: vp lint
      - run: vp run typecheck
      - run: vp run build
      - run: vp test

  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rvben/rumdl@1e0f1d13c87418c31e0d59dacddd98f27a02efcc # v0.3.2
        with:
          version: "0.3.0"
          report-type: annotations

  # Advisories, licences and sources, against the resolved graph rather than the manifests. The other jobs prove the
  # code we wrote is sound; this one is about the code we did not write, which is most of what ships.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: bindings/node/.nvmrc
      - run: npm audit --include=dev
        working-directory: bindings/node

  # ci-ok is the single branch-protection gate: it fails when any job of the run failed or was cancelled, and passes
  # when every triggered job passed or was skipped — so conditional jobs never need enumerating in rulesets.
  ci-ok:
    if: always()
    needs: [fmt, clippy, docs, unsupported-watch, test, go, node, markdown, deny, npm-audit]
    runs-on: ubuntu-24.04
    steps:
      - name: verify all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          [[ "$RESULTS" != *'"failure"'* && "$RESULTS" != *'"cancelled"'* ]]
