name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        # Each platform compiles code of its own, and no other job lints that code.
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # Rustdoc with warnings denied, over this workspace's own crates. A broken intra-doc link, a malformed doc attribute
  # or an undocumented public item fails no other job, so without this one it reaches the published documentation.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # What a publish reads, which only a publish would report otherwise. `cargo package` builds each crate from its own
  # tarball, against the tarballs of the crates it depends on, so a file a crate reads from outside itself fails here.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo package --locked --workspace --exclude kartta-node
      - name: every package holds the licence
        run: |
          for crate in target/package/*.crate; do
            tar -xzOf "$crate" "$(basename "$crate" .crate)/LICENSE" | cmp - LICENSE
          done
      # constraint: crates.io joins a root-absolute link to the crate's own directory
      - name: no README links a root-absolute path
        run: "! grep -n '](/' crates/*/README.md"
      - name: docs.rs documents every feature of a published crate
        run: |
          cargo metadata --locked --no-deps --format-version 1 | jq -e '[.packages[]
            | select(.publish != [] and .features != {} and .metadata.docs.rs["all-features"] != true)] == []'
      # A requirement is the floor a consumer resolves, and the other jobs build the lock's version, or `fresh-resolve`
      # the newest, never the floor. A lock that moves past a requirement, by a bump, `cargo update` or another crate's
      # requirement, fails here.
      - name: every registry requirement names the version Cargo.lock resolves
        # constraint: the default shell runs without pipefail, and jq passes the empty input a refused metadata leaves
        shell: bash
        run: |
          cargo metadata --locked --all-features --format-version 1 | jq -r '
            (.packages | map({key: .id, value: .}) | from_entries) as $packages
            | .workspace_members as $workspace
            | [.resolve.nodes[] | select(IN(.id; $workspace[]))
              | [.deps[].pkg | $packages[.] | {name, req: ("^" + .version)}] as $locked
              | $packages[.id].name as $member
              | $packages[.id].dependencies[] | select(.source // "" | startswith("registry+")) | .name as $name
              | select({name, req} | IN($locked[]) | not)
              | ([$locked[] | select(.name == $name).req | ltrimstr("^")] | join(", ")) as $resolved
              | "\($member): \($name) = \"\(.req | ltrimstr("^"))\", Cargo.lock resolves \($resolved)"]
            | if . == [] then empty
              else map(. + "\n") | add + "write each one as the full version Cargo.lock resolves, without `=`\n"
                | halt_error end'
      # constraint: `doc_cfg` is unstable, so docs.rs reads it on nightly and the pinned stable needs the bootstrap flag
      - name: rustdoc marks a gated item with its feature
        env:
          RUSTC_BOOTSTRAP: 1
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: |
          cargo doc --locked -p kartta -p kartta-fs -p kartta-lang --all-features --no-deps
          grep -q 'crate feature <code>watch' target/doc/kartta/struct.Watcher.html
          grep -q 'crate feature <code>watch' target/doc/kartta_fs/struct.Watcher.html
          grep -q 'crate feature <code>tree-sitter' target/doc/kartta_lang/tree/index.html

  # constraint: the target is one watch.rs gives `watch/unsupported.rs`, which no other job compiles
  unsupported-watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add x86_64-unknown-freebsd
      - run: cargo clippy --locked -p kartta-fs --features watch --target x86_64-unknown-freebsd -- -D warnings

  test:
    env:
      # constraint: the Ubuntu runner starts with 12 GB free, and full debug info fills it with `target` alone
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        # Every platform a plane is consumed on: the vendored grammars compile C, and the FFI boundary is where
        # platform assumptions break.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Every feature, as the clippy job builds: the watcher's backend differs per platform, and this is the only job
      # that runs its tests on each.
      - run: cargo build --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features

  # The workspace's tests on each musl target of the support matrix, in the image `go-musl` enters.
  # constraint: a musl target refuses `kartta-node`'s cdylib while `crt-static` is on, so `node-musl` builds that crate
  test-musl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          docker run --rm -v "$PWD:/src" -w /src -e CARGO_PROFILE_DEV_DEBUG=line-tables-only
          rust:1.99.1-alpine3.24@sha256:7e9e2d068a107a2adafd19930011178d14a78326053cd4c3a9f7ad3fd049557d
          cargo test --locked --workspace --exclude kartta-node --all-features

  # What a `cargo install` without `--locked` builds: the newest version each requirement allows, a dependency's newest
  # release candidate included, which every job under `--locked` does not see. So this job alone moves with crates.io,
  # and a release that breaks kartta fails it for every change until the requirement or the code answers it.
  fresh-resolve:
    env:
      # constraint: the Ubuntu runner starts with 12 GB free, and full debug info fills it with `target` alone
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        # The watcher's backend differs per platform, and a build alone did not fail on a candidate its tests fail on.
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  # The floor, the workspace's `rust-version`, over what a consumer builds: tests and dev-dependencies may be newer.
  # Cargo refuses a toolchain below the field, so raising it fails here until this pin moves too, and a symbol or a
  # dependency newer than the pin fails the check.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        # Each platform compiles code of its own, and no other job holds that code to the floor.
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --workspace --exclude kartta-node --all-features

  # Every crate's public API and the wire against the newest release tag, which both scripts pass without.
  semver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install cargo-semver-checks
        working-directory: ${{ runner.temp }}
        run: |
          archive=cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.51.0/$archive"
          echo "cacadafaa5cd27ae6d05a74a103266917ebab4c5e43c898360e177d4fbf06a65  $archive" | sha256sum -c
          tar -xzf "$archive" -C ~/.cargo/bin
      - run: scripts/semver.sh
      - run: scripts/wire-freeze.sh

  # The Go binding, linked against the static library the same checkout builds. Its cgo build compiles the
  # hand-written kartta.h and links what Go names, and the round trip exercises the ABI's ownership rules under the race
  # detector. The header's signatures are held to the library's by the kartta-ffi reference test.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025-vs2026]
        go: ["1.27.3"]
        # The floor, the go directive of go.mod. setup-go keeps the toolchain from switching, so a directive raised past
        # this entry fails its first go command, and a symbol or a behavior newer than the floor fails its build or
        # its tests.
        include:
          - os: ubuntu-24.04
            go: "1.25.0"
            floor: true
          # constraint: cgo on Windows links with MinGW, which refuses the MSVC target's archive (ADR 4.60)
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # constraint: Windows would run a step in PowerShell, and these use cmp, sha256sum and $GITHUB_PATH
        shell: bash
    env:
      CGO_LDFLAGS: -L${{ github.workspace }}/target/${{ matrix.target }}/debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # constraint: a fetched module holds bindings/go alone, so it carries a copy of the header
      - name: the module's kartta.h equals the library's
        run: cmp crates/kartta-ffi/include/kartta.h bindings/go/kartta.h
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
        if: ${{ matrix.target }}
      # The image's own MinGW moves with the image, and this one is gcc for cargo's C and for cgo alike.
      - name: install MinGW-w64
        if: ${{ matrix.target }}
        working-directory: ${{ runner.temp }}
        run: |
          archive=x86_64-15.2.0-release-posix-seh-ucrt-rt_v13-rev1.7z
          curl -fsSLO "https://github.com/niXman/mingw-builds-binaries/releases/download/15.2.0-rt_v13-rev1/$archive"
          echo "029bd02b5bce7c10fd9476165b3fe178239fe1838ad62516b5c3e0921bb283cf  $archive" | sha256sum -c
          7z x -bd -y "$archive" | tail -3
          cygpath -w "$PWD/mingw64/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The module has no dependencies to cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: cargo build --locked -p kartta-ffi ${{ matrix.target && format('--target {0}', matrix.target) }}
      - run: go vet ./...
        working-directory: bindings/go
      - run: go test -race ./...
        working-directory: bindings/go
      # constraint: this govulncheck needs Go 1.26 to run, and what it judges is the toolchain a build ships with
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        if: ${{ !matrix.floor }}
        working-directory: bindings/go

  # The Go binding against the archive a release ships, on each musl target of the support matrix, on a real musl
  # toolchain: dynamic as a plain `go build` links on Alpine, and static as Kensai links.
  # constraint: the runner refuses a JavaScript action in an Alpine container on arm64, so one step enters the image
  go-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - run: >-
          docker run --rm -v "$PWD:/src" -v "$(go env GOROOT):/usr/local/go:ro" -w /src
          rust:1.99.1-alpine3.24@sha256:7e9e2d068a107a2adafd19930011178d14a78326053cd4c3a9f7ad3fd049557d
          scripts/go-musl.sh ${{ matrix.target }}

  # The Node binding, loading the addon the same checkout builds. Its tests replay the golden files through every typed
  # call and run builds that a signal or close cancels, and its type check holds the wire types to the golden answers.
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    # A test that blocks the JS thread for good would hold the runner for GitHub's 6-hour default (#364).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: bindings/node/.nvmrc
      - run: npm ci --ignore-scripts
      # The vp that package-lock.json pins, so the toolchain moves with the lockfile rather than with an action.
      # constraint: a Windows step runs in PowerShell, where `$GITHUB_PATH` is an empty variable and not the file
      - run: node -e "fs.appendFileSync(process.env.GITHUB_PATH, path.resolve('node_modules/.bin') + '\n')"
      - run: vp fmt --check
      - run: vp lint
      - run: vp run typecheck
      - run: vp run build
      - run: vp test

  # The Node binding on each musl target of the support matrix: the addon its script builds there, and the tests against
  # it. `node` holds the format, lint and type checks, which read the same files on every host. The Rust image builds,
  # and takes Node from the Node image of `.nvmrc`'s version through a volume, because no image holds both.
  node-musl:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # A test that blocks the JS thread for good would hold the runner for GitHub's 6-hour default (#364).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          docker run --rm -v node:/usr/local
          node:24.22.0-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
          true
      - run: >-
          docker run --rm -v "$PWD:/src" -v node:/opt/node:ro -w /src
          rust:1.99.1-alpine3.24@sha256:7e9e2d068a107a2adafd19930011178d14a78326053cd4c3a9f7ad3fd049557d
          scripts/node-musl.sh

  markdown:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rvben/rumdl@1e0f1d13c87418c31e0d59dacddd98f27a02efcc # v0.3.2
        with:
          version: "0.3.0"
          report-type: annotations

  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/version.sh --check

  # Advisories, licences and sources, against the resolved graph rather than the manifests. The other jobs prove the
  # code we wrote is sound; this one is about the code we did not write, which is most of what ships.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # The notices file against Cargo.lock and the pinned toolchain. A dependency or toolchain bump fails here until
  # `python3 notices/generate.py` writes the file that goes with it.
  notices:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup component add rust-src
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.10"
      - run: python notices/generate.py
      - run: git diff --exit-code notices/THIRD-PARTY-NOTICES.txt

  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: bindings/node/.nvmrc
      - run: npm audit --include=dev
        working-directory: bindings/node

  # ci-ok is the single branch-protection gate: it fails when any job of the run failed or was cancelled, and passes
  # when every triggered job passed or was skipped — so conditional jobs never need enumerating in rulesets.
  ci-ok:
    if: always()
    needs:
      - fmt
      - clippy
      - docs
      - package
      - unsupported-watch
      - test
      - test-musl
      - fresh-resolve
      - msrv
      - semver
      - go
      - go-musl
      - node
      - node-musl
      - markdown
      - versions
      - deny
      - notices
      - npm-audit
    runs-on: ubuntu-24.04
    steps:
      - name: verify all jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          [[ "$RESULTS" != *'"failure"'* && "$RESULTS" != *'"cancelled"'* ]]
