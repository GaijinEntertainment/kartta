version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-deps:
        update-types:
          - minor
          - patch
    ignore:
      # tree-sitter is declared by the extractor crate and by every vendored grammar, and the crate sets Cargo's
      # `links = "tree-sitter"` key — exactly one version may exist in the dependency graph. A per-crate bump does
      # not resolve at all, so bumps are manual and move every declaring crate in one commit.
      - dependency-name: tree-sitter

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /bindings/node
    schedule:
      interval: weekly
    groups:
      npm-deps:
        update-types:
          - minor
          - patch
    ignore:
      # constraint: @types/node's major is the Node major it types, and engines.node's floor is 24
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: gomod
    directory: /bindings/go
    schedule:
      interval: weekly
    groups:
      go-deps:
        update-types:
          - minor
          - patch
