# cargo-deny: what the dependency graph is allowed to contain. The other CI gates check the code in this repository;
# this one checks the code that is not, which is the overwhelming majority of what a published crate ships.

[graph]
# Every optional feature is checked, matching the clippy job -- a dependency reachable only under a feature is still a
# dependency, and license or advisory findings do not care which flag pulled it in.
all-features = true

[advisories]
# A yanked version is a maintainer saying "do not use this", and it reaches us only through the lockfile, so it fails
# the build rather than warning into a log nobody reads.
yanked = "deny"
# Every ignore needs a dated reason. An empty list is the correct steady state; an entry here is a debt with a name.
ignore = [
    # 2026-11-24: chrono is unmaintained, with no fixed version. rmcp 3.11.0 depends on it unconditionally and turns on
    # schemars' `chrono04` feature, so no feature setting of kartta-mcp removes it. The advisory names no defect; the
    # entry goes when rmcp drops chrono.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained chrono; rmcp 3.11.0 requires it with no feature to drop it" },
]

[licenses]
# Every licence the resolved graph actually carries, and nothing speculative -- cargo-deny warns on an allowance it
# never matches, so a listed licence nothing uses is itself a finding. A new dependency under a licence not listed here
# fails, which is the point: adopting a licence is a decision, not a side effect of `cargo add`.
#
# Several crates offer a choice: `r-efi` also offers LGPL-2.1-or-later, `rustix` Apache-2.0 WITH LLVM-exception,
# `zerocopy` BSD-2-Clause. SPDX evaluation takes the first satisfiable branch, so allowing MIT and Apache-2.0 settles
# all three, and none of the alternatives needs to appear here.
#
# BSD-3-Clause comes twice. It is the one conjunctive licence: `encoding_rs` is `(Apache-2.0 OR MIT) AND BSD-3-Clause`,
# and it arrives with `grep-searcher`, which links it unconditionally for byte-order-mark sniffing that kartta-fs turns
# off. It is also the only licence of `tree-sitter-daslang`, the grammar kartta-lang-daslang parses with, which no
# other grammar replaces. Like MIT, it asks a binary only to carry the copyright notice.
#
# The watcher's notify brings three more, each with no condition a binary has to meet: CC0-1.0 is notify's own,
# BSL-1.0 is `xxhash-rust`'s, which notify hashes paths with on macOS and Windows, and ISC is `inotify`'s, notify's
# Linux backend, which is in the graph although kartta-fs builds notify only for macOS and Windows.
#
# Zlib is `foldhash`'s, which `serde_json` brings into tree-sitter's build script: it runs while a grammar compiles and
# is linked into nothing, and the licence asks nothing of a binary either way.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# The default 0.8 accepts a paraphrased licence text as a match. These crates are all standard boilerplate, so the bar
# for "this is really that licence" is raised rather than left at a guess.
confidence-threshold = 0.93

[bans]
# Two versions of one crate is usually a transitive lag that resolves itself on the next dependabot run, so it is worth
# seeing and not worth blocking a merge over.
multiple-versions = "warn"
# A wildcard version is an unreviewable dependency: it resolves to whatever exists at build time.
wildcards = "deny"

[sources]
# crates.io and nothing else. A git or path dependency in a published crate is either unpublishable or unauditable, and
# a registry nobody named is how a typosquat arrives.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
