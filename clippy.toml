# Thresholds, deliberately below clippy's defaults. This code is largely agent-written, and the two failure modes that
# survive review are functions that grew a branch at a time and signatures that grew a parameter at a time -- both are
# invisible in a diff and obvious in a threshold.
too-many-arguments-threshold = 4
cognitive-complexity-threshold = 15
excessive-nesting-threshold = 4
too-many-lines-threshold = 80
type-complexity-threshold = 200
max-fn-params-bools = 1
max-struct-bools = 3
single-char-binding-names-threshold = 4
enum-variant-size-threshold = 128

# No surface freezes at a release (design-docs/adr/4.46-release-scope.md), so lints that would otherwise stay silent to
# avoid breaking a published API still fire.
avoid-breaking-exported-api = false

# The no-panic lints below apply to library code only; a test proving a panic is not a defect.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-indexing-slicing-in-tests = true
