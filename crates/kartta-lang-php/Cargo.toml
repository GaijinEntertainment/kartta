[package]
name = "kartta-lang-php"
description = "PHP extraction for the kartta code graph: types, methods, calls, includes and PSR-4 uses of PHP source"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "php", "tree-sitter", "static-analysis", "symbols"]
categories = ["development-tools", "parser-implementations"]

[lints]
workspace = true

[dependencies]
kartta-lang = { workspace = true, features = ["tree-sitter"] }
serde_json = "1.0.154"
tree-sitter = "0.27.1"
tree-sitter-php = "0.25.2"

[build-dependencies]
kartta-lang.workspace = true
