[package]
name = "kartta-lang-python"
description = "Python extraction for the kartta code graph: functions, classes, fields, calls and imports"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "python", "tree-sitter", "static-analysis", "symbols"]
categories = ["development-tools", "parser-implementations"]

[lints]
workspace = true

[dependencies]
kartta-lang = { workspace = true, features = ["tree-sitter"] }
tree-sitter = "0.27.1"
tree-sitter-python = "0.25.0"

[build-dependencies]
kartta-lang.workspace = true
