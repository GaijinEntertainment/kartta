[package]
name = "kartta-lang-bash"
description = "Bash extraction for the kartta code graph: functions, aliases, globals, commands and sourced files"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "bash", "tree-sitter", "static-analysis", "symbols"]
categories = ["development-tools", "parser-implementations"]

[lints]
workspace = true

[dependencies]
kartta-lang = { version = "0.0.0", path = "../kartta-lang", features = ["tree-sitter"] }
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"

[build-dependencies]
kartta-lang = { version = "0.0.0", path = "../kartta-lang" }
