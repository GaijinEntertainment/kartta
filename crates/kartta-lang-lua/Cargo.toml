[package]
name = "kartta-lang-lua"
description = "Lua extraction for the kartta code graph: functions, table methods, calls and module loads of Lua source"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "lua", "tree-sitter", "static-analysis", "symbols"]
categories = ["development-tools", "parser-implementations"]

[lints]
workspace = true

[dependencies]
kartta-lang = { version = "0.0.0", path = "../kartta-lang", features = ["tree-sitter"] }
tree-sitter = "0.27.1"
tree-sitter-lua = "0.5.0"
