[package]
name = "kartta"
description = "Multi-language code graph engine: repository file index, tree-sitter extraction, graph queries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "tree-sitter", "index", "search", "static-analysis"]
categories = ["development-tools", "parser-implementations"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
foldhash = "0.2.0"
kartta-fs.workspace = true
kartta-graph.workspace = true
kartta-lang.workspace = true
rayon = "1.12.0"

[features]
# Building and refreshing with a watcher started before the walk, through kartta-fs's own feature. Off by default: a
# consumer that never watches builds none of it.
watch = ["kartta-fs/watch"]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
