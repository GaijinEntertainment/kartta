[package]
name = "kartta-lang-rust"
description = "Rust extraction for the kartta code graph: items, members, calls and the files `mod` declarations name"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "rust", "tree-sitter", "static-analysis", "symbols"]
categories = ["development-tools", "parser-implementations"]

[lints]
workspace = true

[dependencies]
kartta-lang = { version = "0.0.0", path = "../kartta-lang", features = ["tree-sitter"] }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"

[build-dependencies]
kartta-lang = { version = "0.0.0", path = "../kartta-lang" }
