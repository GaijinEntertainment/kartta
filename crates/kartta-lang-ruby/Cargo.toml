[package]
name = "kartta-lang-ruby"
description = "Ruby extraction for the kartta code graph: classes, modules, methods, mixins, calls and requires"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "ruby", "tree-sitter", "static-analysis", "symbols"]
categories = ["development-tools", "parser-implementations"]

[lints]
workspace = true

[dependencies]
kartta-lang = { version = "0.0.0", path = "../kartta-lang", features = ["tree-sitter"] }
tree-sitter = "0.27.1"
tree-sitter-ruby = "0.23.1"
