[package]
name = "kartta-languages"
description = "Every language the kartta code graph ships, as one set to build with or a selection by name"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "tree-sitter", "static-analysis", "languages", "symbols"]
categories = ["development-tools", "parser-implementations"]

[lints]
workspace = true

[dependencies]
kartta-lang = { version = "0.0.0", path = "../kartta-lang" }
kartta-lang-bash = { version = "0.0.0", path = "../kartta-lang-bash" }
kartta-lang-blk = { version = "0.0.0", path = "../kartta-lang-blk" }
kartta-lang-cpp = { version = "0.0.0", path = "../kartta-lang-cpp" }
kartta-lang-daslang = { version = "0.0.0", path = "../kartta-lang-daslang" }
kartta-lang-dshl = { version = "0.0.0", path = "../kartta-lang-dshl" }
kartta-lang-go = { version = "0.0.0", path = "../kartta-lang-go" }
kartta-lang-jsts = { version = "0.0.0", path = "../kartta-lang-jsts" }
kartta-lang-lua = { version = "0.0.0", path = "../kartta-lang-lua" }
kartta-lang-php = { version = "0.0.0", path = "../kartta-lang-php" }
kartta-lang-puppet = { version = "0.0.0", path = "../kartta-lang-puppet" }
kartta-lang-python = { version = "0.0.0", path = "../kartta-lang-python" }
kartta-lang-quirrel = { version = "0.0.0", path = "../kartta-lang-quirrel" }
kartta-lang-ruby = { version = "0.0.0", path = "../kartta-lang-ruby" }
kartta-lang-rust = { version = "0.0.0", path = "../kartta-lang-rust" }

[dev-dependencies]
kartta = { version = "0.0.0", path = "../kartta" }
tempfile = "3.27.0"
