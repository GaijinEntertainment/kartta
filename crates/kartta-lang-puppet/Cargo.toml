[package]
name = "kartta-lang-puppet"
description = "Puppet extraction for the kartta code graph: classes, defined types, nodes, functions and references"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "puppet", "tree-sitter", "static-analysis", "symbols"]
categories = ["development-tools", "parser-implementations"]

[lints]
workspace = true

[dependencies]
kartta-lang = { workspace = true, features = ["tree-sitter"] }
tree-sitter = "0.27.1"
tree-sitter-puppet = "1.3.0"

[build-dependencies]
kartta-lang.workspace = true
