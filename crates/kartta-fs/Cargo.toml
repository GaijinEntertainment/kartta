[package]
name = "kartta-fs"
description = "Repository file index with glob, fuzzy and content search over a single filesystem walk"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["filesystem", "index", "glob", "grep", "gitignore"]
categories = ["filesystem", "development-tools"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[dependencies]
bstr = "1.14.0"
gix-glob = "0.29.1"
gix-ignore = "0.24.1"
# default-features = false drops `log`, which globset uses only to trace glob compilation.
globset = { version = "0.4.21", default-features = false }
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
kartta-cache.workspace = true
kartta-fuzz.workspace = true
kartta-walk.workspace = true
memmap2 = "0.9.12"
rayon = "1.12.0"
# The parser grep-regex compiles patterns with, read here for the trigrams a match must contain.
regex-syntax = "0.8.12"
thiserror = "2.0.21"

[features]
# Following a tree through the operating system's change notifications. Off by default: a consumer that never watches
# builds none of it.
watch = ["dep:notify"]

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# Linux is watched through inotify directly, so only the directories the index holds are watched. The first release of
# notify that asks Windows to report a lost batch, and inotify for no access events, is 9.0.0.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
notify = { version = "9.0.0", optional = true }
