[package]
name = "kartta-fs"
description = "Repository file index with glob and fuzzy path search over a single filesystem walk"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["filesystem", "index", "glob", "grep", "gitignore"]
categories = ["filesystem", "development-tools"]

[lints]
workspace = true

[dependencies]
bstr = "1.13.1"
gix-glob = "0.29.0"
gix-ignore = "0.24.0"
# default-features = false drops `log`, which globset uses only to trace glob compilation.
globset = { version = "0.4.20", default-features = false }
kartta-fuzz = { version = "0.0.0", path = "../kartta-fuzz" }
kartta-walk = { version = "0.0.0", path = "../kartta-walk" }
rayon = "1.12.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
libc = "0.2.190"
