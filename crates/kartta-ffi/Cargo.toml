[package]
name = "kartta-ffi"
description = "C ABI of the kartta code graph engine: one JSON call per query, for the Go and Node bindings"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["code-graph", "ffi", "c-abi", "json", "bindings"]
categories = ["development-tools", "external-ffi-bindings"]

[lib]
# The static archive is what cgo links; the rlib is what a Rust shell, such as a Node addon, builds on.
crate-type = ["staticlib", "rlib"]

[lints]
workspace = true

[dependencies]
# A build that asks to watch follows its tree through the operating system's change notifications.
kartta = { workspace = true, features = ["watch"] }
kartta-languages.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
# The golden test reads answers back exactly, so a score pinned in a golden file is the one the engine answered.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
# The reference test reads the wire's types from their source, where every field, value and default is stated.
syn = { version = "3.0.10", features = ["full", "visit"] }
tempfile = "3.27.0"
